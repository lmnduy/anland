name: Build kwin (arm64, anland backend)

# Builds the patched kwin .deb on a native arm64 runner, so nothing has to be
# compiled on the phone. The recipe mirrors producers/kde/Debian13_v5/build.sh:
# fetch the Debian source, overlay the anland backend, apply kwin.patch, build.

on:
  workflow_dispatch:
  push:
    branches:
      - kwin-ci

jobs:
  build-kwin:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    container: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates dpkg-dev devscripts equivs patch git \
            libxcb-xtest0-dev
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y kwin

      - name: Fetch kwin source
        run: |
          mkdir -p /work
          cd /work
          apt-get source kwin
          ls -d kwin-* | head -1 > /work/treedir
          echo "source tree: $(cat /work/treedir)"

      - name: Stage anland backend overlay
        run: |
          TREE="$(cat /work/treedir)"
          cd "/work/$TREE"
          # -aL dereferences the common/ and libdisplay_producer/ symlinks into
          # real files; without it CMake fails on the missing sources.
          cp -aL "$GITHUB_WORKSPACE/producers/kde/anland_backend/." .
          patch --batch -p1 --forward --reject-file=- \
            < "$GITHUB_WORKSPACE/producers/kde/Debian13_v5/kwin.patch"
          ls src/backends/anland | head -20

      - name: Patch Xwayland key delivery (XTEST)
        run: |
          TREE="$(cat /work/treedir)"
          python3 - "/work/$TREE" <<'PYEOF'
          import sys, os
          tree = sys.argv[1]

          # 1) link libxcb-xtest so xcb_test_fake_input resolves.
          # ECM's FindXCB does not expose an XCB::XTEST target (Debian trixie),
          # so link the library by name instead.
          cm = os.path.join(tree, "src/CMakeLists.txt")
          s = open(cm).read()
          anchor_cm = "            XCB::SYNC\n            XCB::XCB\n"
          assert s.count(anchor_cm) == 1, "cmake anchor %d" % s.count(anchor_cm)
          if "xcb-xtest" not in s:
              s = s.replace(anchor_cm, "            XCB::SYNC\n            XCB::XCB\n            xcb-xtest\n", 1)
              open(cm, "w").write(s)
              print("cmake: +xcb-xtest")

          # 2) deliver X11-client keys through XTEST instead of the Wayland seat
          p = os.path.join(tree, "src/xwayland/xwayland.cpp")
          s = open(p).read()
          old = (
              "        if (surface) {\n"
              "            ClientConnection *client = surface->client();\n"
              "            if (xwaylandClient == client) {\n"
              "                return false;\n"
              "            }\n"
              "        }\n"
          )
          new = (
              "        if (surface) {\n"
              "            ClientConnection *client = surface->client();\n"
              "            if (xwaylandClient == client) {\n"
              "                fprintf(stderr, \"[anland-xwl] key=%d scan=%u state=%d\\n\",\n"
              "                        int(event->key), event->nativeScanCode, int(event->state));\n"
              "                // An X11 client has focus. Deliver through the X server's\n"
              "                // XTEST extension instead of the Wayland seat: once a game\n"
              "                // grabs input it reads raw/XInput2 device events, which\n"
              "                // seat-synthesised keys do not produce -- the same reason\n"
              "                // xdotool works where the HUD does not.\n"
              "                if (xcb_connection_t *conn = kwinApp()->x11Connection()) {\n"
              "                    const xcb_keycode_t kc = event->nativeScanCode + 8;\n"
              "                    const uint8_t xtype = event->state == KeyboardKeyState::Pressed\n"
              "                        ? XCB_KEY_PRESS : XCB_KEY_RELEASE;\n"
              "                    xcb_test_fake_input(conn, xtype, kc, XCB_CURRENT_TIME, XCB_NONE, 0, 0, 0);\n"
              "                    xcb_flush(conn);\n"
              "                    return true;\n"
              "                }\n"
              "                return false;\n"
              "            }\n"
              "        }\n"
          )
          assert s.count(old) == 1, "xwayland anchor %d" % s.count(old)
          s = s.replace(old, new, 1)
          if "#include <xcb/xtest.h>" not in s:
              s = s.replace('#include "xwayland.h"\n',
                            '#include "xwayland.h"\n\n#include <xcb/xtest.h>\n', 1)
          if '#include "main.h"' not in s:
              s = s.replace('#include "main_wayland.h"\n',
                            '#include "main.h"\n#include "main_wayland.h"\n', 1)
          if "#include <cstdio>" not in s:
              s = s.replace('#include <QAbstractEventDispatcher>\n',
                            '#include <cstdio>\n\n#include <QAbstractEventDispatcher>\n', 1)
          open(p, "w").write(s)
          print("xwayland.cpp: XTEST delivery patched")
          PYEOF

      - name: Build .deb
        run: |
          TREE="$(cat /work/treedir)"
          cd "/work/$TREE"
          DEB_BUILD_OPTIONS="nocheck parallel=$(nproc)" dpkg-buildpackage -b -uc -us -d

      - name: Collect package
        run: |
          ls -l /work/*.deb
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp /work/*.deb "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: kwin-deb
          path: out/*.deb
          if-no-files-found: error
